server:
  port: 8080

spring:
  # Valores por defecto para el Postgres de docker-compose; en otros entornos se inyectan por variables de entorno.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vulnfollowup}
    username: ${DB_USER:vuln_admin}
    password: ${DB_PASSWORD:vuln_password_local}
    driver-class-name: org.postgresql.Driver
  # db/dev contiene usuarios con contraseñas conocidas: en producción usar FLYWAY_LOCATIONS=classpath:db/migration
  flyway:
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

# Escáner de dependencias. El directorio a analizar se configura aquí, no lo elige el usuario.
scanner:
  command: trivy,fs,--format,json,--quiet,--scanners,vuln
  target: ${SCANNER_TARGET:../data/audit-target}
  timeout-seconds: 300

# API de la NVD (NIST). Sin API key: 5 peticiones cada 30 s. Con key gratuita: 50.
nvd:
  base-url: https://services.nvd.nist.gov/rest/json/cves/2.0
  api-key: ${NVD_API_KEY:}
  # Máximo de CVEs que se consultan por análisis (sin key, 20 consultas tardan unos 2 minutos)
  max-lookups: 20

# Secret SOLO para desarrollo local; en producción se inyecta por variable de entorno JWT_SECRET
jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-in-production-256-bits-minimum-length-here}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
