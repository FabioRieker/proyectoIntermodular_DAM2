services:
  postgres-db:
    image: postgres:16-alpine
    container_name: vulnfollowup-db
    environment:
      POSTGRES_USER: vuln_admin
      POSTGRES_PASSWORD: vuln_password_local
      POSTGRES_DB: vulnfollowup
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vuln_admin -d vulnfollowup"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend en contenedor. Solo arranca con:  docker compose --profile app up -d --build
  # (con "docker compose up -d" sigue arrancando solo la base de datos, para desarrollar desde el IDE)
  backend:
    build: ./backend
    container_name: vulnfollowup-backend
    profiles: ["app"]
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres-db:5432/vulnfollowup
      DB_USER: vuln_admin
      DB_PASSWORD: vuln_password_local
      NVD_API_KEY: ${NVD_API_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - ./data/audit-target:/app/audit-target:ro

volumes:
  postgres_data:
